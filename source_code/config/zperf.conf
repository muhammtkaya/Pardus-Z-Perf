# Z-Performans yapılandırması. zperf-gui ve zperfctl tarafından da yazılır.
# Profiller: dengeli, akilli-tahta, ofis (parametreler: docs/05 bölüm 5)
profile = dengeli
enabled = true
# Hiçbir zaman dondurulmayacak uygulamalar (/proc/<pid>/comm adları, virgülle)
never_freeze =
# Sistem bileşenlerine ek olarak dışlanacak uygulamalar
exclude_extra =
