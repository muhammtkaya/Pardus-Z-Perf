# Profil: Dengeli (genel amacli varsayilan)
#
# Bu dosya /etc/zperf/profiles/dengeli.conf olarak kurulur. Varsa zperfd,
# ayni adli gomulu profilin degerlerini buradakilerle gecersiz kilar.
# Dosya yoksa gomulu varsayilanlar kullanilir (asagidakilerle aynidir).
#
# anahtar = deger   (bosluklar serbest, '#' yorum)

tier1_some_pct      = 10      # some avg10 >= %10  -> kademe 1 (kucuk reclaim)
tier2_some_pct      = 25      # some avg10 >= %25  -> kademe 2 (dondur+sikistir)
tier2_full_pct      = 5       # full avg10 >= %5   -> kademe 2
reclaim_step_t1_mb  = 32      # kademe 1 reclaim adimi (MB)
reclaim_step_t2_mb  = 128     # kademe 2 reclaim adimi (MB)
thaw_max_frozen_sec = 45      # bu kadar sn donmus kalan uygulamayi periyodik coz
